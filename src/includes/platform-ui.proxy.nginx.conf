# Proxy a request to the Platform UI CloudFront alias for this environment.
# This file is included only inside exact or prefix locations that are owned by
# the Opportunities application.
set $platform_ui_host platform-ui.{{ENV_TLD}};
set $platform_ui_origin {{ENV_PLATFORM_UI_ORIGIN}};

proxy_http_version 1.1;
proxy_ssl_server_name on;
proxy_ssl_name $platform_ui_host;

proxy_set_header Host $platform_ui_host;
proxy_set_header Connection "";
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Proto $real_scheme;
proxy_set_header X-Real-IP $remote_addr;

proxy_redirect off;
proxy_pass https://$platform_ui_origin$request_uri;
