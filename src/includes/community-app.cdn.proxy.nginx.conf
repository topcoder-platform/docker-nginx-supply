# Preserve the legacy same-origin API path while sending it to Community App.
if ($http_x_forwarded_proto = 'http') {
  return 301 https://$server_name$request_uri;
}

# Use the VPC-scoped AmazonProvidedDNS address from the deployment build vars.
resolver {{ENV_PLATFORM_UI_RESOLVER}} valid=60s ipv6=off;
resolver_timeout 5s;
client_max_body_size 30M;
set $community_app_host "community-app.{{ENV_TLD}}";
proxy_ssl_server_name on;
proxy_ssl_name $community_app_host;
proxy_ssl_verify on;
proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
proxy_ssl_verify_depth 3;
proxy_set_header Host $community_app_host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Proto $real_scheme;
proxy_pass https://$community_app_host$request_uri;
