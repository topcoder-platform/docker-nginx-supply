# Platform UI's Create React App build currently publishes root-relative asset
# URLs. The apex host does not serve an application of its own, so these exact
# public assets and the /static tree can safely stay on the apex while being
# fetched from Platform UI. The www host retains its legacy asset routing.
location = /opportunities {
  include includes/platform-ui.proxy.nginx.conf;
}

location ^~ /opportunities/ {
  include includes/platform-ui.proxy.nginx.conf;
}

location = /thrive {
  include includes/platform-ui.proxy.nginx.conf;
}

location ^~ /thrive/ {
  include includes/platform-ui.proxy.nginx.conf;
}

location ^~ /static/ {
  include includes/platform-ui.proxy.nginx.conf;
}

location = /favicon.png {
  include includes/platform-ui.proxy.nginx.conf;
}

location = /global.css {
  include includes/platform-ui.proxy.nginx.conf;
}

location = /logo_512x512.png {
  include includes/platform-ui.proxy.nginx.conf;
}

location = /manifest.json {
  include includes/platform-ui.proxy.nginx.conf;
}
