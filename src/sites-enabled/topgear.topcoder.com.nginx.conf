#||||||||||||||||||||||
# Server for topgear.topcoder.com
#||||||||||||||||||||||

map $http_cookie $logged_in {
  "~*tcjwt="        1;
  default           0;
}

server {
  listen 8000;
  server_name topgear.{{ENV_TLD}};
  root /data/nginx/apache_docs/tcdocs;
  resolver dns01.topcoder.com valid=30s;
  set $communityAppHost wipro.{{ENV_TLD}};

  # The firewall's HTTPS domain allowlist matches the TLS server name.
  proxy_ssl_server_name on;
  proxy_ssl_name $communityAppHost;

  location = / {
    if ($logged_in = 1) {
      return 301 https://topgear-app.wipro.com;
    }
    if ($logged_in = 0) {
      proxy_pass https://$communityAppHost;
    }
  }

  location / {
    proxy_pass https://$communityAppHost$request_uri;
  }

}
