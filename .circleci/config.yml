version: 2.1

defaults: &defaults
  docker:
    - image: cimg/python:3.13.2-browsers

production_defaults: &production_defaults
  docker:
    - image: cimg/python:3.13.2-browsers@sha256:882c0efbf6c617fd18eed8cea5db0949a5bebe3af8465a6c52700140cc24067a
  resource_class: medium.gen2

install_dependency: &install_dependency
  name: Installation of build and deployment dependencies
  command: |
    sudo apt update
    sudo apt install -y jq python3-pip
    sudo pip3 install 'awscli==1.46.0' 'PyYAML==6.0.3'

install_deploysuite: &install_deploysuite
  name: Installation of the pinned deployment suite
  command: |
    git clone --quiet --depth 1 --branch v.1.4.18 \
      https://github.com/topcoder-platform/tc-deploy-scripts "${HOME}/buildscript"
    test "$(git -C "${HOME}/buildscript" rev-parse HEAD)" = \
      f2fa1d1b8d57c635176ef5a3a6f0e0425e88fdbe
    cp "${HOME}/buildscript/master_deploy.sh" .
    cp "${HOME}/buildscript/buildenv.sh" .

aws_configuration: &aws_configuration
  name: AWS configuration
  command: |
    ./scripts/configure-nonproduction-aws.sh "${DEPLOY_ENV}"

build_image: &build_image
  name: Build and validate Docker image
  command: |
    set -euo pipefail
    set +x
    umask 077
    source ./scripts/load-ssm-environment.sh
    load_ssm_environment "${SSM_CONFIG_ROOT}/buildvar" \
      --required \
        ENV_PLATFORM_UI_RESOLVER
    ./buildimage.sh "${DEPLOY_ENV}"
    unset ENV_PLATFORM_UI_RESOLVER

deploy_image: &deploy_image
  name: Deploy to AWS
  command: |
    set -euo pipefail
    set +x
    umask 077
    cleanup_nonproduction_credentials() {
      ./scripts/cleanup-nonproduction-aws.sh
      rm -f \
        awsenvconf \
        buildvar_env \
        deployvar_env
    }
    trap cleanup_nonproduction_credentials EXIT
    test "${AWS_ACCOUNT_ID}" = "${EXPECTED_NONPRODUCTION_AWS_ACCOUNT_ID}"
    test "${AWS_REGION}" = us-east-1
    test "${AWS_DEFAULT_REGION}" = us-east-1
    [[ "${NONPRODUCTION_AWS_CREDENTIAL_DIRECTORY}" =~ ^/tmp/nginx-supply-nonprod-aws\.[A-Za-z0-9]+$ ]]
    test "${AWS_CONFIG_FILE}" = \
      "${NONPRODUCTION_AWS_CREDENTIAL_DIRECTORY}/config"
    test "${AWS_SHARED_CREDENTIALS_FILE}" = \
      "${NONPRODUCTION_AWS_CREDENTIAL_DIRECTORY}/credentials"
    source ./scripts/load-ssm-environment.sh
    for forbidden_runtime_override_variable in \
      AWS_ECS_TASK_ROLE_ARN \
      AWS_ECS_TASK_EXECUTION_ROLE_ARN \
      AWS_ECS_VOLUMES \
      AWS_ECS_CONTAINER_HEALTH_CMD \
      AWS_ECS_CONTAINER_CMD
    do
      if [[ -n "${!forbidden_runtime_override_variable+x}" ]]; then
        printf 'Non-production context injected a forbidden runtime override: %s\n' \
          "${forbidden_runtime_override_variable}" >&2
        exit 1
      fi
    done
    load_ssm_environment "${SSM_CONFIG_ROOT}/deployvar" \
      --required \
        AWS_REPOSITORY \
        AWS_ECS_CLUSTER \
        AWS_ECS_SERVICE \
        AWS_ECS_TASK_FAMILY \
        AWS_ECS_CONTAINER_NAME \
        AWS_ECS_PORTS \
        AWS_ECS_READONLY_ROOTFILESYSTEM \
        AWS_ECS_VOLUMES_EFS \
      --optional \
        AWS_ECS_CONTAINER_MEMORY_RESERVATION \
        AWS_ECS_CONTAINER_CPU \
        AWS_ECS_FARGATE_CPU \
        AWS_ECS_FARGATE_MEMORY
    test "${AWS_ECS_READONLY_ROOTFILESYSTEM}" = false
    export AWS_ECS_TASK_ROLE_ARN='' \
      AWS_ECS_TASK_EXECUTION_ROLE_ARN='' \
      AWS_ECS_VOLUMES='' \
      AWS_ECS_CONTAINER_HEALTH_CMD='' \
      AWS_ECS_CONTAINER_CMD=''
    readonly AWS_ECS_TASK_ROLE_ARN AWS_ECS_TASK_EXECUTION_ROLE_ARN \
      AWS_ECS_VOLUMES AWS_ECS_CONTAINER_HEALTH_CMD AWS_ECS_CONTAINER_CMD
    source ./scripts/validate-efs-mapping.sh
    validate_efs_mapping \
      "${AWS_ECS_VOLUMES_EFS}" \
      "${EXPECTED_AWS_ECS_VOLUMES_EFS_SHA256}"
    printf '%s\n' \
      "${AWS_REPOSITORY}" \
      "${AWS_ECS_CLUSTER}" \
      "${AWS_ECS_SERVICE}" \
      "${AWS_ECS_TASK_FAMILY}" \
      "${AWS_ECS_CONTAINER_NAME}" \
      "${AWS_ECS_PORTS}" \
      "${AWS_ECS_READONLY_ROOTFILESYSTEM}" \
      "${AWS_ECS_VOLUMES_EFS}" \
      "${AWS_ECS_CONTAINER_MEMORY_RESERVATION}" \
      "${AWS_ECS_CONTAINER_CPU}" \
      "${AWS_ECS_FARGATE_CPU}" \
      "${AWS_ECS_FARGATE_MEMORY}" | \
      ./scripts/verify-no-retired-provider-routes.py -
    runtime_parameters_response="$(
      aws ssm get-parameters-by-path \
        --path "${SSM_CONFIG_ROOT}/appvar" \
        --no-recursive \
        --query 'Parameters[].{Name:Name,Type:Type}' \
        --output json
    )"
    readonly runtime_parameters_response
    printf '%s\n' "${runtime_parameters_response}" | \
      jq -e 'type == "array" and length == 0' >/dev/null
    ./master_deploy.sh \
      -d ECS \
      -e "${DEPLOY_ENV}" \
      -t latest \
      -i nginx-supply \
      -p FARGATE
    cleanup_nonproduction_credentials
    trap - EXIT

build_and_deploy_steps: &build_and_deploy_steps
  - checkout
  - setup_remote_docker
  - run: *install_dependency
  - run: *install_deploysuite
  - run: *aws_configuration
  - run: *build_image
  - deploy: *deploy_image

production_tooling_steps: &production_tooling_steps
  - checkout
  - run:
      name: Prepare hash-locked production tooling without AWS authority
      command: |
        set -euo pipefail
        readonly tooling_directory='/tmp/nginx-supply-tooling'
        readonly deploysuite_directory='/tmp/nginx-supply-deploysuite-source'
        readonly circleci_extract_directory='/tmp/nginx-supply-circleci-cli-extract'
        readonly circleci_cli_version='1.0.48692'
        readonly circleci_cli_archive_sha256='c7c10708b271b88573f7c73ba314bc4d3d495a8c0b21f0648d9250b2dee347bd'
        readonly circleci_cli_binary_sha256='b1db12daab590229e591fd9899d08783685c9e0ac1bf451b3f0671e5b4032294'
        [[ "${CIRCLE_SHA1}" =~ ^[0-9a-f]{40}$ ]]
        test ! -e "${tooling_directory}"
        test ! -e "${deploysuite_directory}"
        test ! -e "${circleci_extract_directory}"
        mkdir --mode=0700 "${tooling_directory}"
        python3 -m venv "${tooling_directory}/venv"
        "${tooling_directory}/venv/bin/pip" --isolated install \
          --require-hashes \
          --no-deps \
          --index-url https://pypi.org/simple \
          --requirement scripts/production-tooling-requirements.txt
        "${tooling_directory}/venv/bin/python" -c 'import yaml'
        "${tooling_directory}/venv/bin/aws" --version
        test "$(jq --version)" = jq-1.6

        circleci_cli_archive="${tooling_directory}/circleci-cli.tar.gz"
        readonly circleci_cli_archive
        curl --fail --location --silent --show-error \
          --proto '=https' --tlsv1.2 \
          --output "${circleci_cli_archive}" \
          "https://github.com/CircleCI-Public/circleci-cli/releases/download/v${circleci_cli_version}/circleci-cli_${circleci_cli_version}_linux_amd64.tar.gz"
        printf '%s  %s\n' \
          "${circleci_cli_archive_sha256}" "${circleci_cli_archive}" | \
          sha256sum --check --strict -
        mkdir --mode=0700 "${circleci_extract_directory}"
        tar --extract --gzip --file "${circleci_cli_archive}" \
          --directory "${circleci_extract_directory}" circleci
        install --mode=0755 "${circleci_extract_directory}/circleci" \
          "${tooling_directory}/circleci"
        find "${circleci_extract_directory}" -mindepth 1 -delete
        rmdir "${circleci_extract_directory}"
        rm -f "${circleci_cli_archive}"
        test "$(sha256sum "${tooling_directory}/circleci" | awk '{print $1}')" = \
          "${circleci_cli_binary_sha256}"
        test "$("${tooling_directory}/circleci" version)" = \
          "circleci ${circleci_cli_version} (8492ee467fd2)"
        ./scripts/test-circleci-config.sh \
          "${tooling_directory}/circleci" \
          "${tooling_directory}/venv/bin/python"

        git clone --quiet --depth 1 --branch v.1.4.18 \
          https://github.com/topcoder-platform/tc-deploy-scripts \
          "${deploysuite_directory}"
        test "$(git -C "${deploysuite_directory}" rev-parse HEAD)" = \
          f2fa1d1b8d57c635176ef5a3a6f0e0425e88fdbe
        test "$(sha256sum "${deploysuite_directory}/master_deploy.sh" | awk '{print $1}')" = \
          55be8659807ee2d80f00078b0c4aa483adae222ddf2adc9db23f25ea64c02886
        test "$(sha256sum "${deploysuite_directory}/base_template_v2.json" | awk '{print $1}')" = \
          2739b4981a18cbf7394689262f55f7bbb85c773bb8d2261108ca8e23b1fccc4e
        git -C "${deploysuite_directory}" apply --check \
          "${PWD}/scripts/master-deploy-immutable-retry.patch"
        git -C "${deploysuite_directory}" apply \
          "${PWD}/scripts/master-deploy-immutable-retry.patch"
        test "$(sha256sum "${deploysuite_directory}/master_deploy.sh" | awk '{print $1}')" = \
          7a946096255d2532d3bd020a49b67ee09f8d742dfcd5d15949aee8b8af1ea234
        install --mode=0755 "${deploysuite_directory}/master_deploy.sh" \
          "${tooling_directory}/master_deploy.sh"
        install --mode=0644 "${deploysuite_directory}/base_template_v2.json" \
          "${tooling_directory}/base_template_v2.json"

        printf '%s\n' "${CIRCLE_SHA1}" > "${tooling_directory}/source-sha.txt"
        sha256sum scripts/production-tooling-requirements.txt | awk '{print $1}' \
          > "${tooling_directory}/requirements-sha256.txt"
        {
          printf 'source_sha=%s\n' "${CIRCLE_SHA1}"
          printf 'executor_image=%s\n' \
            'cimg/python:3.13.2-browsers@sha256:882c0efbf6c617fd18eed8cea5db0949a5bebe3af8465a6c52700140cc24067a'
          printf 'requirements_sha256=%s\n' \
            "$(cat "${tooling_directory}/requirements-sha256.txt")"
          printf 'deploy_suite_commit=%s\n' \
            f2fa1d1b8d57c635176ef5a3a6f0e0425e88fdbe
          printf 'master_deploy_sha256=%s\n' \
            7a946096255d2532d3bd020a49b67ee09f8d742dfcd5d15949aee8b8af1ea234
          printf 'ecs_template_sha256=%s\n' \
            2739b4981a18cbf7394689262f55f7bbb85c773bb8d2261108ca8e23b1fccc4e
          printf 'circleci_cli_version=%s\n' "${circleci_cli_version}"
          printf 'circleci_cli_archive_sha256=%s\n' "${circleci_cli_archive_sha256}"
          printf 'circleci_cli_binary_sha256=%s\n' "${circleci_cli_binary_sha256}"
          printf 'aws_cli=%s\n' \
            "$("${tooling_directory}/venv/bin/aws" --version 2>&1)"
          "${tooling_directory}/venv/bin/pip" freeze
        } | tee "${tooling_directory}/tooling-manifest.txt"
  - persist_to_workspace:
      root: /tmp
      paths:
        - nginx-supply-tooling
  - store_artifacts:
      path: /tmp/nginx-supply-tooling/tooling-manifest.txt
      destination: production-tooling/tooling-manifest.txt

production_build_steps: &production_build_steps
  - checkout
  - setup_remote_docker:
      version: docker28
  - attach_workspace:
      at: /tmp
  - run:
      name: Build and validate the production Docker image
      command: |
        set -euo pipefail
        set +x
        umask 077
        readonly tooling_directory='/tmp/nginx-supply-tooling'
        test "$(cat "${tooling_directory}/source-sha.txt")" = "${CIRCLE_SHA1}"
        test "$(sha256sum scripts/production-tooling-requirements.txt | awk '{print $1}')" = \
          "$(cat "${tooling_directory}/requirements-sha256.txt")"
        export PATH="${tooling_directory}/venv/bin:${PATH}"
        test "$(command -v aws)" = "${tooling_directory}/venv/bin/aws"
        cleanup_build_credentials() {
          rm -f "${HOME}/.aws/credentials" "${HOME}/.aws/config"
        }
        trap cleanup_build_credentials EXIT

        export AWS_EC2_METADATA_DISABLED=true
        ./scripts/configure-production-build-aws.sh \
          ENV_PLATFORM_UI_RESOLVER
        unset CIRCLE_OIDC_TOKEN CIRCLE_OIDC_TOKEN_V2 \
          AWS_PRODUCTION_BUILD_ROLE_ARN \
          AWS_PRODUCTION_BUILD_KMS_KEY_ARN
        source ./scripts/load-ssm-environment.sh
        load_ssm_environment "/config/${APPNAME}/buildvar" \
          --required \
            ENV_PLATFORM_UI_RESOLVER
        cleanup_build_credentials
        ./buildimage.sh "${DEPLOY_ENV}"
        unset ENV_PLATFORM_UI_RESOLVER
        unset AWS_EC2_METADATA_DISABLED
        trap - EXIT
  - run:
      name: Package the exact production image for approval
      command: |
        set -euo pipefail
        readonly release_directory='/tmp/nginx-supply-release'
        [[ "${CIRCLE_SHA1}" =~ ^[0-9a-f]{40}$ ]]
        test "$(docker image inspect nginx-supply:latest \
          --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = \
          "${CIRCLE_SHA1}"
        test ! -e "${release_directory}"
        mkdir --mode=0700 "${release_directory}"
        printf '%s\n' "${CIRCLE_SHA1}" > "${release_directory}/source-sha.txt"
        image_id="$(docker image inspect nginx-supply:latest --format '{{.Id}}')"
        readonly image_id
        [[ "${image_id}" =~ ^sha256:[0-9a-f]{64}$ ]]
        printf '%s\n' "${image_id}" > "${release_directory}/image-id.txt"
        docker version --format '{{.Server.Version}}' \
          > "${release_directory}/docker-server-version.txt"
        docker save nginx-supply:latest | gzip --no-name \
          > "${release_directory}/nginx-supply.tar.gz"
        pushd "${release_directory}" >/dev/null
        sha256sum nginx-supply.tar.gz > nginx-supply.tar.gz.sha256
        archive_config_path="$(
          gzip --decompress --stdout nginx-supply.tar.gz | \
            tar -xOf - manifest.json | jq -er '.[0].Config'
        )"
        readonly archive_config_path
        [[ "${archive_config_path}" =~ ^([0-9a-f]{64}\.json|blobs/sha256/[0-9a-f]{64})$ ]]
        archive_config_sha256="$(
          gzip --decompress --stdout nginx-supply.tar.gz | \
            tar -xOf - "${archive_config_path}" | sha256sum | awk '{print $1}'
        )"
        readonly archive_config_sha256
        [[ "${archive_config_sha256}" =~ ^[0-9a-f]{64}$ ]]
        printf 'sha256:%s\n' "${archive_config_sha256}" > config-digest.txt
        {
          printf 'source_sha=%s\n' "$(cat source-sha.txt)"
          printf 'image_id=%s\n' "$(cat image-id.txt)"
          printf 'config_digest=%s\n' "$(cat config-digest.txt)"
          printf 'docker_server_version=%s\n' "$(cat docker-server-version.txt)"
          printf 'archive_sha256=%s\n' "$(awk '{print $1}' nginx-supply.tar.gz.sha256)"
        } | tee release-manifest.txt
        popd >/dev/null
  - persist_to_workspace:
      root: /tmp
      paths:
        - nginx-supply-release
  - store_artifacts:
      path: /tmp/nginx-supply-release/release-manifest.txt
      destination: production-build/release-manifest.txt

production_verify_steps: &production_verify_steps
  - checkout
  - setup_remote_docker:
      version: docker28
  - attach_workspace:
      at: /tmp
  - run:
      name: Verify the production artifact without deployment authority
      command: |
        set -euo pipefail
        readonly tooling_directory='/tmp/nginx-supply-tooling'
        readonly release_directory='/tmp/nginx-supply-release'
        [[ "${CIRCLE_SHA1}" =~ ^[0-9a-f]{40}$ ]]
        test "$(cat "${tooling_directory}/source-sha.txt")" = "${CIRCLE_SHA1}"
        test "$(sha256sum scripts/production-tooling-requirements.txt | awk '{print $1}')" = \
          "$(cat "${tooling_directory}/requirements-sha256.txt")"
        test "$(sha256sum "${tooling_directory}/master_deploy.sh" | awk '{print $1}')" = \
          7a946096255d2532d3bd020a49b67ee09f8d742dfcd5d15949aee8b8af1ea234
        test "$(sha256sum "${tooling_directory}/base_template_v2.json" | awk '{print $1}')" = \
          2739b4981a18cbf7394689262f55f7bbb85c773bb8d2261108ca8e23b1fccc4e
        test "$(sha256sum "${tooling_directory}/circleci" | awk '{print $1}')" = \
          b1db12daab590229e591fd9899d08783685c9e0ac1bf451b3f0671e5b4032294
        ./scripts/test-circleci-config.sh \
          "${tooling_directory}/circleci" \
          "${tooling_directory}/venv/bin/python"
        export PATH="${tooling_directory}/venv/bin:${PATH}"
        test "$(command -v aws)" = "${tooling_directory}/venv/bin/aws"
        test "$(cat "${release_directory}/source-sha.txt")" = "${CIRCLE_SHA1}"
        (
          cd "${release_directory}"
          sha256sum --check --strict nginx-supply.tar.gz.sha256
        )
        archive_config_path="$(
          gzip --decompress --stdout "${release_directory}/nginx-supply.tar.gz" | \
            tar -xOf - manifest.json | jq -er '.[0].Config'
        )"
        readonly archive_config_path
        [[ "${archive_config_path}" =~ ^([0-9a-f]{64}\.json|blobs/sha256/[0-9a-f]{64})$ ]]
        archive_config_sha256="$(
          gzip --decompress --stdout "${release_directory}/nginx-supply.tar.gz" | \
            tar -xOf - "${archive_config_path}" | sha256sum | awk '{print $1}'
        )"
        readonly archive_config_sha256
        test "sha256:${archive_config_sha256}" = \
          "$(cat "${release_directory}/config-digest.txt")"
        test "$(docker version --format '{{.Server.Version}}')" = \
          "$(cat "${release_directory}/docker-server-version.txt")"
        gzip --decompress --stdout "${release_directory}/nginx-supply.tar.gz" | docker load
        loaded_image_id="$(docker image inspect nginx-supply:latest --format '{{.Id}}')"
        readonly loaded_image_id
        test "${loaded_image_id}" = "$(cat "${release_directory}/image-id.txt")"
        test "$(docker image inspect nginx-supply:latest \
          --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = \
          "${CIRCLE_SHA1}"
        expected_manifest="$(
          printf 'source_sha=%s\n' "$(cat "${release_directory}/source-sha.txt")"
          printf 'image_id=%s\n' "$(cat "${release_directory}/image-id.txt")"
          printf 'config_digest=%s\n' "$(cat "${release_directory}/config-digest.txt")"
          printf 'docker_server_version=%s\n' \
            "$(cat "${release_directory}/docker-server-version.txt")"
          printf 'archive_sha256=%s\n' \
            "$(awk '{print $1}' "${release_directory}/nginx-supply.tar.gz.sha256")"
        )"
        readonly expected_manifest
        test "$(cat "${release_directory}/release-manifest.txt")" = \
          "${expected_manifest}"
        ./scripts/test-runtime.sh nginx-supply:latest
        ./scripts/verify-provider-off-image.sh nginx-supply:latest "${CIRCLE_SHA1}"
        ./scripts/test-production-approval.py
        ./scripts/test-load-ssm-environment.sh
        ./scripts/test-versioned-ssm-environment.sh
        ./scripts/test-configure-nonproduction-aws.sh
        ./scripts/test-production-authority-gates.sh
        ./scripts/test-configure-production-snapshot-aws.sh
        ./scripts/test-production-snapshot-session-policy.sh
        ./scripts/test-efs-mapping.sh
        ./scripts/test-task-definition-contract.py
        ./scripts/test-community-app-cdn-route.sh
        if [[ -x ./scripts/test-retired-provider-routes.sh ]]; then
          ./scripts/test-retired-provider-routes.sh
        fi
        {
          cat "${release_directory}/release-manifest.txt"
          printf 'route_contracts_verified=true\n'
        } | tee "${release_directory}/verification-manifest.txt"
  - persist_to_workspace:
      root: /tmp
      paths:
        - nginx-supply-release/verification-manifest.txt
  - store_artifacts:
      path: /tmp/nginx-supply-release/verification-manifest.txt
      destination: production-verification/verification-manifest.txt

production_snapshot_steps: &production_snapshot_steps
  - checkout
  - attach_workspace:
      at: /tmp
  - run:
      name: Snapshot exact production deploy-variable versions for approval
      command: |
        set -euo pipefail
        set +x
        umask 077
        readonly tooling_directory='/tmp/nginx-supply-tooling'
        readonly release_directory='/tmp/nginx-supply-release'
        [[ "${CIRCLE_SHA1}" =~ ^[0-9a-f]{40}$ ]]
        test "$(cat "${tooling_directory}/source-sha.txt")" = "${CIRCLE_SHA1}"
        test "$(cat "${release_directory}/source-sha.txt")" = "${CIRCLE_SHA1}"
        test -s "${release_directory}/verification-manifest.txt"
        export PATH="${tooling_directory}/venv/bin:${PATH}"
        test "$(command -v aws)" = "${tooling_directory}/venv/bin/aws"
        cleanup_snapshot_credentials() {
          rm -f "${HOME}/.aws/credentials" "${HOME}/.aws/config"
        }
        trap cleanup_snapshot_credentials EXIT

        export AWS_EC2_METADATA_DISABLED=true
        ./scripts/configure-production-deployvar-snapshot-aws.sh
        unset CIRCLE_OIDC_TOKEN CIRCLE_OIDC_TOKEN_V2 \
          AWS_PRODUCTION_DEPLOYVAR_SNAPSHOT_ROLE_ARN
        source ./scripts/load-ssm-environment.sh
        snapshot_ssm_environment \
          "/config/${APPNAME}/deployvar" \
          "${release_directory}/deployvar-versions.tsv" \
          --required \
            AWS_REPOSITORY \
            AWS_ECS_CLUSTER \
            AWS_ECS_SERVICE \
            AWS_ECS_TASK_FAMILY \
            AWS_ECS_CONTAINER_NAME \
            AWS_ECS_PORTS \
            AWS_ECS_READONLY_ROOTFILESYSTEM \
            AWS_ECS_VOLUMES_EFS \
          --optional \
            AWS_ECS_CONTAINER_MEMORY_RESERVATION \
            AWS_ECS_CONTAINER_CPU \
            AWS_ECS_FARGATE_CPU \
            AWS_ECS_FARGATE_MEMORY
        cleanup_snapshot_credentials
        unset AWS_EC2_METADATA_DISABLED
        trap - EXIT

        test "$(head -n 1 "${release_directory}/deployvar-versions.tsv")" = \
          nginx-supply-ssm-version-manifest-v1
        test "$(tail -n +2 "${release_directory}/deployvar-versions.tsv" | wc -l | tr -d ' ')" = 12
        (
          cd "${release_directory}"
          sha256sum deployvar-versions.tsv > deployvar-versions.tsv.sha256
        )
        deployvar_present_count="$(
          awk -F '\t' '$1 == "present" { count += 1 } END { print count + 0 }' \
            "${release_directory}/deployvar-versions.tsv"
        )"
        readonly deployvar_present_count
        deployvar_absent_count="$((12 - deployvar_present_count))"
        readonly deployvar_absent_count
        {
          printf 'source_sha=%s\n' "${CIRCLE_SHA1}"
          printf 'deployvar_versions_sha256=%s\n' \
            "$(awk '{print $1}' "${release_directory}/deployvar-versions.tsv.sha256")"
          printf 'deployvar_present_count=%s\n' "${deployvar_present_count}"
          printf 'deployvar_absent_optional_count=%s\n' "${deployvar_absent_count}"
        } | tee "${release_directory}/deployvar-snapshot-manifest.txt"
  - persist_to_workspace:
      root: /tmp
      paths:
        - nginx-supply-release/deployvar-versions.tsv
        - nginx-supply-release/deployvar-versions.tsv.sha256
        - nginx-supply-release/deployvar-snapshot-manifest.txt
  - store_artifacts:
      path: /tmp/nginx-supply-release/deployvar-snapshot-manifest.txt
      destination: production-deployvar-snapshot/deployvar-snapshot-manifest.txt
  - store_artifacts:
      path: /tmp/nginx-supply-release/deployvar-versions.tsv
      destination: production-deployvar-snapshot/deployvar-versions.tsv

production_deploy_steps: &production_deploy_steps
  - checkout
  - setup_remote_docker:
      version: docker28
  - attach_workspace:
      at: /tmp
  - run:
      name: Reverify the approved production inputs before assuming the deploy role
      command: |
        set -euo pipefail
        readonly tooling_directory='/tmp/nginx-supply-tooling'
        readonly release_directory='/tmp/nginx-supply-release'
        [[ "${CIRCLE_SHA1}" =~ ^[0-9a-f]{40}$ ]]
        test "$(cat "${tooling_directory}/source-sha.txt")" = "${CIRCLE_SHA1}"
        test "$(sha256sum scripts/production-tooling-requirements.txt | awk '{print $1}')" = \
          "$(cat "${tooling_directory}/requirements-sha256.txt")"
        test "$(sha256sum "${tooling_directory}/master_deploy.sh" | awk '{print $1}')" = \
          7a946096255d2532d3bd020a49b67ee09f8d742dfcd5d15949aee8b8af1ea234
        test "$(sha256sum "${tooling_directory}/base_template_v2.json" | awk '{print $1}')" = \
          2739b4981a18cbf7394689262f55f7bbb85c773bb8d2261108ca8e23b1fccc4e
        test "$(sha256sum "${tooling_directory}/circleci" | awk '{print $1}')" = \
          b1db12daab590229e591fd9899d08783685c9e0ac1bf451b3f0671e5b4032294
        ./scripts/test-circleci-config.sh \
          "${tooling_directory}/circleci" \
          "${tooling_directory}/venv/bin/python"
        export PATH="${tooling_directory}/venv/bin:${PATH}"
        test "$(command -v aws)" = "${tooling_directory}/venv/bin/aws"
        test "$(cat "${release_directory}/source-sha.txt")" = "${CIRCLE_SHA1}"
        (
          cd "${release_directory}"
          sha256sum --check --strict nginx-supply.tar.gz.sha256
        )
        archive_config_path="$(
          gzip --decompress --stdout "${release_directory}/nginx-supply.tar.gz" | \
            tar -xOf - manifest.json | jq -er '.[0].Config'
        )"
        readonly archive_config_path
        [[ "${archive_config_path}" =~ ^([0-9a-f]{64}\.json|blobs/sha256/[0-9a-f]{64})$ ]]
        archive_config_sha256="$(
          gzip --decompress --stdout "${release_directory}/nginx-supply.tar.gz" | \
            tar -xOf - "${archive_config_path}" | sha256sum | awk '{print $1}'
        )"
        readonly archive_config_sha256
        test "sha256:${archive_config_sha256}" = \
          "$(cat "${release_directory}/config-digest.txt")"
        test "$(docker version --format '{{.Server.Version}}')" = \
          "$(cat "${release_directory}/docker-server-version.txt")"
        gzip --decompress --stdout "${release_directory}/nginx-supply.tar.gz" | docker load
        loaded_image_id="$(docker image inspect nginx-supply:latest --format '{{.Id}}')"
        readonly loaded_image_id
        test "${loaded_image_id}" = "$(cat "${release_directory}/image-id.txt")"
        test "$(docker image inspect nginx-supply:latest \
          --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = \
          "${CIRCLE_SHA1}"
        expected_manifest="$(
          printf 'source_sha=%s\n' "$(cat "${release_directory}/source-sha.txt")"
          printf 'image_id=%s\n' "$(cat "${release_directory}/image-id.txt")"
          printf 'config_digest=%s\n' "$(cat "${release_directory}/config-digest.txt")"
          printf 'docker_server_version=%s\n' \
            "$(cat "${release_directory}/docker-server-version.txt")"
          printf 'archive_sha256=%s\n' \
            "$(awk '{print $1}' "${release_directory}/nginx-supply.tar.gz.sha256")"
        )"
        readonly expected_manifest
        test "$(cat "${release_directory}/release-manifest.txt")" = \
          "${expected_manifest}"
        expected_verification_manifest="$(
          cat "${release_directory}/release-manifest.txt"
          printf 'route_contracts_verified=true\n'
        )"
        readonly expected_verification_manifest
        test "$(cat "${release_directory}/verification-manifest.txt")" = \
          "${expected_verification_manifest}"
        (
          cd "${release_directory}"
          sha256sum --check --strict deployvar-versions.tsv.sha256
        )
        deployvar_present_count="$(
          awk -F '\t' '$1 == "present" { count += 1 } END { print count + 0 }' \
            "${release_directory}/deployvar-versions.tsv"
        )"
        readonly deployvar_present_count
        deployvar_absent_count="$((12 - deployvar_present_count))"
        readonly deployvar_absent_count
        expected_snapshot_manifest="$(
          printf 'source_sha=%s\n' "${CIRCLE_SHA1}"
          printf 'deployvar_versions_sha256=%s\n' \
            "$(awk '{print $1}' "${release_directory}/deployvar-versions.tsv.sha256")"
          printf 'deployvar_present_count=%s\n' "${deployvar_present_count}"
          printf 'deployvar_absent_optional_count=%s\n' "${deployvar_absent_count}"
        )"
        readonly expected_snapshot_manifest
        test "$(cat "${release_directory}/deployvar-snapshot-manifest.txt")" = \
          "${expected_snapshot_manifest}"
        ./scripts/test-runtime.sh nginx-supply:latest
        ./scripts/verify-provider-off-image.sh nginx-supply:latest "${CIRCLE_SHA1}"
  - run:
      name: Deploy the approved production image
      no_output_timeout: 20m
      command: |
        set -euo pipefail
        set +x
        umask 077
        readonly tooling_directory='/tmp/nginx-supply-tooling'
        readonly release_directory='/tmp/nginx-supply-release'
        export PATH="${tooling_directory}/venv/bin:${PATH}"
        test "$(command -v aws)" = "${tooling_directory}/venv/bin/aws"
        readonly master_deploy_path="${tooling_directory}/master_deploy.sh"
        test "$(sha256sum "${master_deploy_path}" | awk '{print $1}')" = \
          7a946096255d2532d3bd020a49b67ee09f8d742dfcd5d15949aee8b8af1ea234
        readonly deploysuite_runtime_directory="${HOME}/buildscript"
        test ! -e "${deploysuite_runtime_directory}"
        mkdir --mode=0700 "${deploysuite_runtime_directory}"
        install --mode=0644 "${tooling_directory}/base_template_v2.json" \
          "${deploysuite_runtime_directory}/base_template_v2.json"
        test "$(sha256sum "${deploysuite_runtime_directory}/base_template_v2.json" | awk '{print $1}')" = \
          2739b4981a18cbf7394689262f55f7bbb85c773bb8d2261108ca8e23b1fccc4e
        approved_source_sha="$(cat "${release_directory}/source-sha.txt")"
        readonly approved_source_sha
        test "${approved_source_sha}" = "${CIRCLE_SHA1}"
        approved_image_id="$(cat "${release_directory}/image-id.txt")"
        readonly approved_image_id
        approved_config_digest="$(cat "${release_directory}/config-digest.txt")"
        readonly approved_config_digest
        [[ "${approved_image_id}" =~ ^sha256:[0-9a-f]{64}$ ]]
        [[ "${approved_config_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
        readonly expected_account_id="${EXPECTED_AWS_ACCOUNT_ID}"
        readonly expected_region="${AWS_REGION}"
        readonly expected_appname="${APPNAME}"
        readonly expected_deploy_env="${DEPLOY_ENV}"
        test "${expected_appname}" = docker-nginx-supply
        test "${expected_deploy_env}" = PROD

        for inherited_credential_name in \
          AWS_ACCESS_KEY_ID \
          AWS_SECRET_ACCESS_KEY \
          AWS_SESSION_TOKEN \
          AWS_SECURITY_TOKEN \
          AWS_PROFILE \
          AWS_DEFAULT_PROFILE \
          AWS_SHARED_CREDENTIALS_FILE \
          AWS_CONFIG_FILE \
          AWS_WEB_IDENTITY_TOKEN_FILE \
          AWS_ROLE_ARN \
          AWS_CONTAINER_CREDENTIALS_FULL_URI \
          AWS_CONTAINER_CREDENTIALS_RELATIVE_URI \
          AWS_CA_BUNDLE \
          AWS_ENDPOINT_URL
        do
          if [[ -n "${!inherited_credential_name+x}" ]]; then
            printf 'Production deploy context injected a forbidden AWS credential provider: %s\n' \
              "${inherited_credential_name}" >&2
            exit 1
          fi
        done
        while IFS= read -r endpoint_variable_name; do
          printf 'Production deploy context injected a forbidden AWS endpoint override: %s\n' \
            "${endpoint_variable_name}" >&2
          exit 1
        done < <(compgen -A variable AWS_ENDPOINT_URL_)
        credential_directory="$(mktemp -d /tmp/nginx-supply-deploy-credentials.XXXXXX)"
        readonly credential_directory
        mkdir --mode=0700 \
          "${credential_directory}/aws" \
          "${credential_directory}/docker"
        export AWS_CONFIG_FILE="${credential_directory}/aws/config"
        export AWS_SHARED_CREDENTIALS_FILE="${credential_directory}/aws/credentials"
        export AWS_EC2_METADATA_DISABLED=true
        export AWS_DEFAULT_REGION="${expected_region}"
        export DOCKER_CONFIG="${credential_directory}/docker"

        cleanup_deploy_credentials() {
          if [[ -d "${credential_directory}" ]]; then
            find "${credential_directory}" -mindepth 1 -delete
            rmdir "${credential_directory}"
          fi
        }
        trap cleanup_deploy_credentials EXIT

        ./scripts/configure-production-deploy-aws.sh
        unset CIRCLE_OIDC_TOKEN CIRCLE_OIDC_TOKEN_V2
        caller_identity="$(aws sts get-caller-identity --output json)"
        readonly caller_identity
        caller_account_id="$(jq -er '.Account' \<<< "${caller_identity}")"
        readonly caller_account_id
        test "${caller_account_id}" = "${expected_account_id}"
        caller_arn="$(jq -er '.Arn' \<<< "${caller_identity}")"
        readonly caller_arn
        [[ "${caller_arn}" =~ ^arn:aws:sts::409275337247:assumed-role/circleci-docker-nginx-supply-prod-deploy/nginx-supply-deploy-[A-Za-z0-9+=,.@-]+$ ]]

        source ./scripts/load-ssm-environment.sh
        for forbidden_task_override_variable in \
          AWS_ECS_TASK_ROLE_ARN \
          AWS_ECS_TASK_EXECUTION_ROLE_ARN \
          AWS_ECS_VOLUMES \
          AWS_ECS_CONTAINER_HEALTH_CMD \
          AWS_ECS_CONTAINER_CMD
        do
          if [[ -n "${!forbidden_task_override_variable+x}" ]]; then
            printf 'Production deploy received a forbidden task override: %s\n' \
              "${forbidden_task_override_variable}" >&2
            exit 1
          fi
        done
        load_ssm_environment_from_manifest \
          "/config/${expected_appname}/deployvar" \
          "${release_directory}/deployvar-versions.tsv" \
          --required \
            AWS_REPOSITORY \
            AWS_ECS_CLUSTER \
            AWS_ECS_SERVICE \
            AWS_ECS_TASK_FAMILY \
            AWS_ECS_CONTAINER_NAME \
            AWS_ECS_PORTS \
            AWS_ECS_READONLY_ROOTFILESYSTEM \
            AWS_ECS_VOLUMES_EFS \
          --optional \
            AWS_ECS_CONTAINER_MEMORY_RESERVATION \
            AWS_ECS_CONTAINER_CPU \
            AWS_ECS_FARGATE_CPU \
            AWS_ECS_FARGATE_MEMORY
        export AWS_ACCOUNT_ID="${caller_account_id}"
        readonly AWS_ACCOUNT_ID
        test "${AWS_REGION}" = "${expected_region}"
        readonly AWS_REGION
        [[ "${AWS_REPOSITORY}" =~ ^[a-z0-9]+([._/-][a-z0-9]+)*$ ]]
        [[ "${AWS_ECS_CLUSTER}" =~ ^[A-Za-z0-9_-]+$ ]]
        [[ "${AWS_ECS_SERVICE}" =~ ^[A-Za-z0-9_-]+([,\ ][A-Za-z0-9_-]+)*$ ]]
        [[ "${AWS_ECS_TASK_FAMILY}" =~ ^[A-Za-z0-9_-]+$ ]]
        [[ "${AWS_ECS_CONTAINER_NAME}" =~ ^[A-Za-z0-9_-]+$ ]]
        test "${AWS_ECS_READONLY_ROOTFILESYSTEM}" = false
        export AWS_ECS_VOLUMES='' \
          AWS_ECS_CONTAINER_HEALTH_CMD='' \
          AWS_ECS_CONTAINER_CMD=''
        readonly AWS_ECS_VOLUMES AWS_ECS_CONTAINER_HEALTH_CMD AWS_ECS_CONTAINER_CMD
        source ./scripts/validate-efs-mapping.sh
        validate_efs_mapping \
          "${AWS_ECS_VOLUMES_EFS}" \
          "${EXPECTED_AWS_ECS_VOLUMES_EFS_SHA256}"
        for numeric_variable_name in \
          AWS_ECS_CONTAINER_MEMORY_RESERVATION \
          AWS_ECS_CONTAINER_CPU \
          AWS_ECS_FARGATE_CPU \
          AWS_ECS_FARGATE_MEMORY
        do
          if [[ -n "${!numeric_variable_name}" ]]; then
            [[ "${!numeric_variable_name}" =~ ^[0-9]+$ ]]
          fi
        done
        IFS=',' read -r -a port_mappings \<<< "${AWS_ECS_PORTS}"
        test "${#port_mappings[@]}" -gt 0
        for port_mapping in "${port_mappings[@]}"; do
          [[ "${port_mapping}" =~ ^([0-9]{1,5}):([0-9]{1,5}):(tcp|udp)$ ]]
          (( 10#${BASH_REMATCH[1]} >= 1 && 10#${BASH_REMATCH[1]} <= 65535 ))
          (( 10#${BASH_REMATCH[2]} >= 1 && 10#${BASH_REMATCH[2]} <= 65535 ))
        done
        expected_port_mappings="$(
          printf '%s\n' "${port_mappings[@]}" | jq -Rsc '
            split("\n") |
            map(select(length > 0)) |
            map(split(":") | {
              hostPort: (.[0] | tonumber),
              containerPort: (.[1] | tonumber),
              protocol: .[2]
            }) |
            sort_by(.containerPort, .hostPort, .protocol)
          '
        )"
        readonly expected_port_mappings
        jq -e 'type == "array" and length > 0' \
          \<<< "${expected_port_mappings}" >/dev/null
        readonly expected_container_memory_reservation="${AWS_ECS_CONTAINER_MEMORY_RESERVATION:-1000}"
        readonly expected_container_cpu="${AWS_ECS_CONTAINER_CPU:-100}"
        readonly expected_fargate_cpu="${AWS_ECS_FARGATE_CPU:-1024}"
        readonly expected_fargate_memory="${AWS_ECS_FARGATE_MEMORY:-2048}"
        printf '%s\n' \
          "${AWS_REPOSITORY}" \
          "${AWS_ECS_CLUSTER}" \
          "${AWS_ECS_SERVICE}" \
          "${AWS_ECS_TASK_FAMILY}" \
          "${AWS_ECS_CONTAINER_NAME}" \
          "${AWS_ECS_PORTS}" \
          "${AWS_ECS_READONLY_ROOTFILESYSTEM}" \
          "${AWS_ECS_VOLUMES_EFS}" \
          "${AWS_ECS_CONTAINER_MEMORY_RESERVATION}" \
          "${AWS_ECS_CONTAINER_CPU}" \
          "${AWS_ECS_FARGATE_CPU}" \
          "${AWS_ECS_FARGATE_MEMORY}" | \
          ./scripts/verify-no-retired-provider-routes.py -

        service_names="${AWS_ECS_SERVICE//,/ }"
        read -r -a services \<<< "${service_names}"
        test "${#services[@]}" -gt 0
        declare -A service_lookup=()
        for service in "${services[@]}"; do
          test -z "${service_lookup[$service]:-}"
          service_lookup["${service}"]=1
        done
        cluster_response="$(
          aws ecs describe-clusters \
            --clusters "${AWS_ECS_CLUSTER}" \
            --output json
        )"
        readonly cluster_response
        test "$(jq -er '(.failures // []) | length' \<<< "${cluster_response}")" = 0
        test "$(jq -er '.clusters | length' \<<< "${cluster_response}")" = 1
        test "$(jq -er '.clusters[0].clusterName' \<<< "${cluster_response}")" = \
          "${AWS_ECS_CLUSTER}"
        test "$(jq -er '.clusters[0].status' \<<< "${cluster_response}")" = ACTIVE
        services_response="$(
          aws ecs describe-services \
            --cluster "${AWS_ECS_CLUSTER}" \
            --services "${services[@]}" \
            --output json
        )"
        readonly services_response
        test "$(jq -er '(.failures // []) | length' \<<< "${services_response}")" = 0
        test "$(jq -er '.services | length' \<<< "${services_response}")" = \
          "${#services[@]}"
        readonly task_definition_prefix="arn:aws:ecs:${expected_region}:${caller_account_id}:task-definition/${AWS_ECS_TASK_FAMILY}:"
        declare -A previous_task_definitions=()
        : > "${release_directory}/previous-service-task-definitions.txt"
        for service in "${services[@]}"; do
          jq -e --arg service "${service}" '
            ([.services[] | select(.serviceName == $service)] | length) == 1 and
            ([.services[] | select(.serviceName == $service)][0] |
              .status == "ACTIVE" and
              .deploymentController.type == "ECS" and
              (.desiredCount > 0) and
              (.runningCount == .desiredCount) and
              (.pendingCount == 0) and
              ((.deployments // []) | length) == 1 and
              .deployments[0].status == "PRIMARY" and
              .deployments[0].rolloutState == "COMPLETED")
          ' \<<< "${services_response}" >/dev/null
          current_task_definition_arn="$(
            jq -er --arg service "${service}" \
              '.services[] | select(.serviceName == $service) | .taskDefinition' \
              \<<< "${services_response}"
          )"
          [[ "${current_task_definition_arn}" == "${task_definition_prefix}"* ]]
          [[ "${current_task_definition_arn#"${task_definition_prefix}"}" =~ ^[0-9]+$ ]]
          previous_task_definitions["${service}"]="${current_task_definition_arn}"
          printf 'previous_service_task_definition.%s=%s\n' \
            "${service}" "${current_task_definition_arn}" \
            >> "${release_directory}/previous-service-task-definitions.txt"
        done
        readonly appvar_path="/config/${expected_appname}/appvar"
        runtime_parameters_response="$(
          aws ssm get-parameters-by-path \
            --path "${appvar_path}" \
            --no-recursive \
            --query 'Parameters[].{Name:Name,Type:Type}' \
            --output json
        )"
        readonly runtime_parameters_response
        jq -e --arg prefix "${appvar_path}/" '
          (type == "array") and
          (length == 0) and
          (all(.[].Name; startswith($prefix))) and
          (all(.[].Name;
            (ltrimstr($prefix) | test("^[A-Za-z_][A-Za-z0-9_]*$")))) and
          (all(.[].Type; . == "SecureString")) and
          (([.[].Name] | unique | length) == length)
        ' \<<< "${runtime_parameters_response}" >/dev/null
        jq -r \
          --arg prefix "${appvar_path}/" \
          --arg arn_prefix "arn:aws:ssm:${expected_region}:${caller_account_id}:parameter" '
            .[] |
            [(.Name | ltrimstr($prefix)), ($arn_prefix + .Name)] |
            @tsv
          ' \<<< "${runtime_parameters_response}" | sort \
          > "${release_directory}/expected-runtime-parameter-references.tsv"
        runtime_parameter_count="$(
          wc -l < "${release_directory}/expected-runtime-parameter-references.tsv" | \
            tr -d ' '
        )"
        readonly runtime_parameter_count
        [[ "${runtime_parameter_count}" =~ ^[0-9]+$ ]]
        runtime_parameter_references_sha256="$(
          sha256sum "${release_directory}/expected-runtime-parameter-references.tsv" | \
            awk '{print $1}'
        )"
        readonly runtime_parameter_references_sha256
        [[ "${runtime_parameter_references_sha256}" =~ ^[0-9a-f]{64}$ ]]
        readonly log_group_name="/aws/ecs/${AWS_ECS_CLUSTER}"
        log_groups_response="$(
          aws logs describe-log-groups \
            --log-group-name-prefix "${log_group_name}" \
            --output json
        )"
        readonly log_groups_response
        test "$(
          jq -er --arg name "${log_group_name}" \
            '[.logGroups[] | select(.logGroupName == $name)] | length' \
            \<<< "${log_groups_response}"
        )" = 1

        repository_mutability="$(
          aws ecr describe-repositories \
            --repository-names "${AWS_REPOSITORY}" \
            --query 'repositories[0].imageTagMutability' \
            --output text
        )"
        readonly repository_mutability
        test "${repository_mutability}" = IMMUTABLE

        existing_image_response="$(
          aws ecr batch-get-image \
            --repository-name "${AWS_REPOSITORY}" \
            --image-ids "imageTag=${approved_source_sha}" \
            --accepted-media-types \
              application/vnd.docker.distribution.manifest.v2+json \
              application/vnd.oci.image.manifest.v1+json \
            --output json
        )"
        readonly existing_image_response
        existing_image_count="$(
          jq -er '.images | length' \<<< "${existing_image_response}"
        )"
        readonly existing_image_count
        existing_failure_count="$(
          jq -er '(.failures // []) | length' \<<< "${existing_image_response}"
        )"
        readonly existing_failure_count
        if [[ "${existing_image_count}" = 1 && "${existing_failure_count}" = 0 ]]; then
          test "$(
            jq -er '.images[0].imageId.imageTag' \<<< "${existing_image_response}"
          )" = "${approved_source_sha}"
          existing_manifest="$(
            jq -er '.images[0].imageManifest' \<<< "${existing_image_response}"
          )"
          readonly existing_manifest
          test "$(jq -er '.config.digest' \<<< "${existing_manifest}")" = \
            "${approved_config_digest}"
          export ECS_SKIP_ECR_PUSH=true
        else
          test "${existing_image_count}" = 0
          test "${existing_failure_count}" = 1
          test "$(
            jq -er '.failures[0].failureCode' \<<< "${existing_image_response}"
          )" = ImageNotFound
          test "$(
            jq -er '.failures[0].imageId.imageTag' \<<< "${existing_image_response}"
          )" = "${approved_source_sha}"
          export ECS_SKIP_ECR_PUSH=false
        fi

        readonly registry_image="${caller_account_id}.dkr.ecr.${expected_region}.amazonaws.com/${AWS_REPOSITORY}:${approved_source_sha}"
        test "$(docker image inspect nginx-supply:latest --format '{{.Id}}')" = \
          "${approved_image_id}"
        test "$(docker image inspect nginx-supply:latest \
          --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = \
          "${approved_source_sha}"
        docker tag "${approved_image_id}" "${registry_image}"
        test "$(docker image inspect "${registry_image}" --format '{{.Id}}')" = \
          "${approved_image_id}"

        "${master_deploy_path}" \
          -d ECS \
          -e "${expected_deploy_env}" \
          -t "${approved_source_sha}" \
          -p FARGATE

        remote_image_response="$(
          aws ecr batch-get-image \
            --repository-name "${AWS_REPOSITORY}" \
            --image-ids "imageTag=${approved_source_sha}" \
            --accepted-media-types \
              application/vnd.docker.distribution.manifest.v2+json \
              application/vnd.oci.image.manifest.v1+json \
            --output json
        )"
        readonly remote_image_response
        test "$(jq -er '(.failures // []) | length' \<<< "${remote_image_response}")" = 0
        test "$(jq -er '.images | length' \<<< "${remote_image_response}")" = 1
        remote_tag="$(jq -er '.images[0].imageId.imageTag' \<<< "${remote_image_response}")"
        readonly remote_tag
        test "${remote_tag}" = "${approved_source_sha}"
        remote_digest="$(
          jq -er '.images[0].imageId.imageDigest' \<<< "${remote_image_response}"
        )"
        readonly remote_digest
        [[ "${remote_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]

        remote_manifest="$(jq -er '.images[0].imageManifest' \<<< "${remote_image_response}")"
        readonly remote_manifest
        remote_config_digest="$(jq -er '.config.digest' \<<< "${remote_manifest}")"
        readonly remote_config_digest
        test "${remote_config_digest}" = "${approved_config_digest}"
        post_push_repository_mutability="$(
          aws ecr describe-repositories \
            --repository-names "${AWS_REPOSITORY}" \
            --query 'repositories[0].imageTagMutability' \
            --output text
        )"
        readonly post_push_repository_mutability
        test "${post_push_repository_mutability}" = IMMUTABLE

        aws ecs wait services-stable \
          --cluster "${AWS_ECS_CLUSTER}" \
          --services "${services[@]}"
        deployed_services_response="$(
          aws ecs describe-services \
            --cluster "${AWS_ECS_CLUSTER}" \
            --services "${services[@]}" \
            --output json
        )"
        readonly deployed_services_response
        test "$(jq -er '(.failures // []) | length' \<<< "${deployed_services_response}")" = 0
        test "$(jq -er '.services | length' \<<< "${deployed_services_response}")" = \
          "${#services[@]}"
        readonly expected_execution_role_arn="arn:aws:iam::${caller_account_id}:role/ecsTaskExecutionRole"
        : > "${release_directory}/deployed-services.txt"
        for service in "${services[@]}"; do
          jq -e --arg service "${service}" '
            ([.services[] | select(.serviceName == $service)] | length) == 1 and
            ([.services[] | select(.serviceName == $service)][0] |
              .status == "ACTIVE" and
              .deploymentController.type == "ECS" and
              (.desiredCount > 0) and
              (.runningCount == .desiredCount) and
              (.pendingCount == 0) and
              ((.deployments // []) | length) == 1 and
              .deployments[0].status == "PRIMARY" and
              .deployments[0].rolloutState == "COMPLETED")
          ' \<<< "${deployed_services_response}" >/dev/null
          task_definition_arn="$(
            jq -er --arg service "${service}" \
              '.services[] | select(.serviceName == $service) | .taskDefinition' \
              \<<< "${deployed_services_response}"
          )"
          [[ "${task_definition_arn}" == "${task_definition_prefix}"* ]]
          [[ "${task_definition_arn#"${task_definition_prefix}"}" =~ ^[0-9]+$ ]]
          test "${task_definition_arn}" != "${previous_task_definitions[$service]}"
          task_definition_response="$(
            aws ecs describe-task-definition \
              --task-definition "${task_definition_arn}" \
              --output json
          )"
          jq -e \
            --arg family "${AWS_ECS_TASK_FAMILY}" \
            --arg container "${AWS_ECS_CONTAINER_NAME}" \
            --arg image "${registry_image}" \
            --arg execution_role "${expected_execution_role_arn}" \
            --arg efs_volume_name "${VALIDATED_EFS_VOLUME_NAME}" \
            --arg efs_root_directory "${VALIDATED_EFS_ROOT_DIRECTORY}" \
            --arg efs_container_path "${VALIDATED_EFS_CONTAINER_PATH}" \
            --arg efs_filesystem_id "${VALIDATED_EFS_FILESYSTEM_ID}" \
            --argjson expected_port_mappings "${expected_port_mappings}" \
            --arg expected_container_memory_reservation "${expected_container_memory_reservation}" \
            --arg expected_container_cpu "${expected_container_cpu}" \
            --arg expected_fargate_cpu "${expected_fargate_cpu}" \
            --arg expected_fargate_memory "${expected_fargate_memory}" '
              .taskDefinition.family == $family and
              .taskDefinition.networkMode == "awsvpc" and
              ((.taskDefinition.requiresCompatibilities // []) | index("FARGATE") != null) and
              ((.taskDefinition.taskRoleArn // "") == "") and
              .taskDefinition.executionRoleArn == $execution_role and
              .taskDefinition.cpu == $expected_fargate_cpu and
              .taskDefinition.memory == $expected_fargate_memory and
              ((.taskDefinition.volumes // []) | length) == 1 and
              (.taskDefinition.volumes[0] |
                .name == $efs_volume_name and
                .efsVolumeConfiguration.fileSystemId == $efs_filesystem_id and
                .efsVolumeConfiguration.rootDirectory == $efs_root_directory and
                ((.efsVolumeConfiguration.transitEncryption // "DISABLED") == "DISABLED") and
                ((.efsVolumeConfiguration.transitEncryptionPort // null) == null) and
                ((.efsVolumeConfiguration.authorizationConfig // null) == null)) and
              ((.taskDefinition.containerDefinitions // []) | length) == 1 and
              ([.taskDefinition.containerDefinitions[] |
                select(.name == $container)][0] |
                  .image == $image and
                  .essential == true and
                  .memoryReservation == ($expected_container_memory_reservation | tonumber) and
                  .cpu == ($expected_container_cpu | tonumber) and
                  ((.portMappings // []) |
                    map({
                      hostPort,
                      containerPort,
                      protocol: (.protocol // "tcp")
                    }) |
                    sort_by(.containerPort, .hostPort, .protocol)) == $expected_port_mappings and
                  ((.privileged // false) == false) and
                  .readonlyRootFilesystem == false and
                  (((.entryPoint // []) | length) == 0) and
                  (((.command // []) | length) == 0) and
                  ((.healthCheck // null) == null) and
                  ((.mountPoints // []) | length) == 1 and
                  (.mountPoints[0] |
                    .sourceVolume == $efs_volume_name and
                    .containerPath == $efs_container_path and
                    ((.readOnly // false) == false)) and
                  (((.volumesFrom // []) | length) == 0) and
                  (((.environment // []) | length) == 0) and
                  (((.secrets // []) | length) == 0))
            ' \<<< "${task_definition_response}" >/dev/null
          jq -r --arg container "${AWS_ECS_CONTAINER_NAME}" '
            .taskDefinition.containerDefinitions[] |
            select(.name == $container) |
            (.secrets // [])[] |
            [.name, .valueFrom] |
            @tsv
          ' \<<< "${task_definition_response}" | sort \
            > "${release_directory}/deployed-runtime-parameter-references.tsv"
          cmp --silent \
            "${release_directory}/expected-runtime-parameter-references.tsv" \
            "${release_directory}/deployed-runtime-parameter-references.tsv"
          printf 'deployed_service_task_definition.%s=%s\n' \
            "${service}" "${task_definition_arn}" \
            >> "${release_directory}/deployed-services.txt"
        done
        rm -f \
          "${release_directory}/deployed-runtime-parameter-references.tsv" \
          "${release_directory}/expected-runtime-parameter-references.tsv"

        {
          cat "${release_directory}/release-manifest.txt"
          printf 'registry_image=%s\n' "${registry_image}"
          printf 'registry_digest=%s\n' "${remote_digest}"
          printf 'registry_config_digest=%s\n' "${remote_config_digest}"
          printf 'registry_tag_mutability=%s\n' "${post_push_repository_mutability}"
          printf 'registry_push_skipped=%s\n' "${ECS_SKIP_ECR_PUSH}"
          printf 'runtime_parameter_count=%s\n' "${runtime_parameter_count}"
          printf 'runtime_parameter_references_sha256=%s\n' \
            "${runtime_parameter_references_sha256}"
          printf 'efs_mapping_sha256=%s\n' "${VALIDATED_EFS_MAPPING_SHA256}"
          printf 'deployvar_versions_sha256=%s\n' \
            "$(awk '{print $1}' "${release_directory}/deployvar-versions.tsv.sha256")"
          cat "${release_directory}/previous-service-task-definitions.txt"
          cat "${release_directory}/deployed-services.txt"
        } | tee "${release_directory}/deployment-manifest.txt"
        cleanup_deploy_credentials
        trap - EXIT
  - store_artifacts:
      path: /tmp/nginx-supply-release/deployment-manifest.txt
      destination: production-deploy/deployment-manifest.txt

jobs:
  "build-dev":
    <<: *defaults
    environment:
      DEPLOY_ENV: "DEV"
      LOGICAL_ENV: "dev"
      APPNAME: "docker-nginx-supply"
      SSM_CONFIG_ROOT: "/config/docker-nginx-supply/dev"
      EXPECTED_NONPRODUCTION_AWS_ACCOUNT_ID: "811668436784"
      EXPECTED_NONPRODUCTION_AWS_ROLE_NAME: "circleci-docker-nginx-supply-dev-deploy"
      EXPECTED_AWS_ECS_VOLUMES_EFS_SHA256: "INVENTORY_REQUIRED"
    steps: *build_and_deploy_steps

  "prepare-prod-tooling":
    <<: *production_defaults
    steps: *production_tooling_steps

  "build-prod":
    <<: *production_defaults
    environment:
      DEPLOY_ENV: "PROD"
      LOGICAL_ENV: "prod"
      APPNAME: "docker-nginx-supply"
      AWS_REGION: "us-east-1"
      EXPECTED_AWS_ACCOUNT_ID: "409275337247"
      PRODUCTION_AUTHORITY_BOUNDARY_STATUS: "BLOCKED_SAME_PROJECT_OIDC"
      EXPECTED_AWS_ECS_VOLUMES_EFS_SHA256: "INVENTORY_REQUIRED"
    steps: *production_build_steps

  "verify-prod":
    <<: *production_defaults
    environment:
      DEPLOY_ENV: "PROD"
      LOGICAL_ENV: "prod"
      APPNAME: "docker-nginx-supply"
    steps: *production_verify_steps

  "snapshot-prod-deployvars":
    <<: *production_defaults
    environment:
      DEPLOY_ENV: "PROD"
      LOGICAL_ENV: "prod"
      APPNAME: "docker-nginx-supply"
      AWS_REGION: "us-east-1"
      EXPECTED_AWS_ACCOUNT_ID: "409275337247"
      PRODUCTION_AUTHORITY_BOUNDARY_STATUS: "BLOCKED_SAME_PROJECT_OIDC"
      EXPECTED_AWS_ECS_VOLUMES_EFS_SHA256: "INVENTORY_REQUIRED"
    steps: *production_snapshot_steps

  "deploy-prod":
    <<: *production_defaults
    environment:
      DEPLOY_ENV: "PROD"
      LOGICAL_ENV: "prod"
      APPNAME: "docker-nginx-supply"
      AWS_REGION: "us-east-1"
      EXPECTED_AWS_ACCOUNT_ID: "409275337247"
      PRODUCTION_AUTHORITY_BOUNDARY_STATUS: "BLOCKED_SAME_PROJECT_OIDC"
      EXPECTED_AWS_ECS_VOLUMES_EFS_SHA256: "INVENTORY_REQUIRED"
    steps: *production_deploy_steps

  "build-qa":
    <<: *defaults
    environment:
      DEPLOY_ENV: "QA"
      LOGICAL_ENV: "qa"
      APPNAME: "docker-nginx-supply"
      SSM_CONFIG_ROOT: "/config/docker-nginx-supply/qa"
      EXPECTED_NONPRODUCTION_AWS_ACCOUNT_ID: "INVENTORY_REQUIRED"
      EXPECTED_NONPRODUCTION_AWS_ROLE_NAME: "circleci-docker-nginx-supply-qa-deploy"
      EXPECTED_AWS_ECS_VOLUMES_EFS_SHA256: "INVENTORY_REQUIRED"
    steps: *build_and_deploy_steps

workflows:
  version: 2
  build:
    jobs:
      - "build-dev":
          context: docker-nginx-supply-dev-deploy
          filters:
            branches:
              only: [dev, 'dev-nginx118', 'CORE-799-fix-v1']

      - "prepare-prod-tooling":
          filters:
            branches:
              only: master

      - "approve-prod":
          type: approval
          requires:
            - "prepare-prod-tooling"
          filters:
            branches:
              only: master

      - "build-prod":
          context: docker-nginx-supply-prod-build
          requires:
            - "approve-prod"
          filters:
            branches:
              only: master

      - "verify-prod":
          requires:
            - "build-prod"
          filters:
            branches:
              only: master

      - "snapshot-prod-deployvars":
          context: docker-nginx-supply-prod-deployvar-snapshot
          requires:
            - "verify-prod"
          filters:
            branches:
              only: master

      - "approve-prod-deploy":
          type: approval
          requires:
            - "snapshot-prod-deployvars"
          filters:
            branches:
              only: master

      - "deploy-prod":
          context: docker-nginx-supply-prod-deploy
          serial-group: << pipeline.project.slug >>/production-ecs
          requires:
            - "approve-prod-deploy"
          filters:
            branches:
              only: master

      - "build-qa":
          context: docker-nginx-supply-qa-deploy
          filters:
            branches:
              only: qa
